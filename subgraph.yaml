specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: Pepper
    network: chiliz
    source:
      address: "0x60F397acBCfB8f4e3234C659A3E10867e6fA6b67"
      abi: Pepper
      startBlock: 16912309
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Approval
        - ClaimEnabledStatusChanged
        - ClaimStartBlockChanged
        - Claimed
        - EpochLengthChanged
        - MinimumCHZStakedAmountChanged
        - OwnershipTransferred
        - RewardsCHZStakedAmountChanged
        - RoleAdminChanged
        - RoleGranted
        - RoleRevoked
        - StakingContractChanged
        - StakingPoolContractChanged
        - Transfer
      abis:
        - name: Pepper
          file: ./abis/Pepper.json
      eventHandlers:
        - event: Approval(indexed address,indexed address,uint256)
          handler: handleApproval
        - event: ClaimEnabledStatusChanged(indexed bool)
          handler: handleClaimEnabledStatusChanged
        - event: ClaimStartBlockChanged(indexed uint256)
          handler: handleClaimStartBlockChanged
        - event: Claimed(indexed address,indexed uint256,indexed uint256)
          handler: handleClaimed
        - event: EpochLengthChanged(indexed uint16)
          handler: handleEpochLengthChanged
        - event: MinimumCHZStakedAmountChanged(indexed uint256)
          handler: handleMinimumCHZStakedAmountChanged
        - event: OwnershipTransferred(indexed address,indexed address)
          handler: handleOwnershipTransferred
        - event: RewardsCHZStakedAmountChanged(indexed uint256)
          handler: handleRewardsCHZStakedAmountChanged
        - event: RoleAdminChanged(indexed bytes32,indexed bytes32,indexed bytes32)
          handler: handleRoleAdminChanged
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleRoleRevoked
        - event: StakingContractChanged(indexed address)
          handler: handleStakingContractChanged
        - event: StakingPoolContractChanged(indexed address)
          handler: handleStakingPoolContractChanged
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
      file: ./src/pepper.ts
